name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: pihci
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            partnersinhealth/openhim-advapacs-mediator:latest

  scan:
    needs: publish
    uses: PIH/openmrs-contrib-distro-tools/.github/workflows/scan-docker-image.yml@main
    with:
      image_name: partnersinhealth/openhim-advapacs-mediator
    permissions:
      security-events: write

  deploy:
    needs: publish
    concurrency:
      group: deploy-to-app-cluster-${{ github.ref }}
      cancel-in-progress: true
    uses: PIH/openmrs-contrib-distro-tools/.github/workflows/deploy-via-runner.yml@main
    with:
      runner-label: appclstr-01
      notify_ci_dashboard: true
    secrets: inherit
