name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Notify ci-dashboard (build started)
        continue-on-error: true
        uses: PIH/openmrs-contrib-distro-tools/.github/actions/notify-ci-dashboard@main
        with:
          token: ${{ secrets.GHA_WRITE_TOKEN }}
          phase: started
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: pihci
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            partnersinhealth/openhim-advapacs-mediator:latest

  notify-ci-dashboard:
    needs: build-and-publish
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify ci-dashboard (build finished)
        continue-on-error: true
        uses: PIH/openmrs-contrib-distro-tools/.github/actions/notify-ci-dashboard@main
        with:
          token: ${{ secrets.GHA_WRITE_TOKEN }}
          phase: finished

  scan:
    needs: build-and-publish
    uses: PIH/openmrs-contrib-distro-tools/.github/workflows/scan-docker-image.yml@main
    with:
      image_name: partnersinhealth/openhim-advapacs-mediator
    permissions:
      security-events: write

  deploy-to-kol-ci:
    needs: build-and-publish
    uses: PIH/openmrs-contrib-distro-tools/.github/workflows/deploy-via-runner.yml@main
    with:
      runner-label: appclstr-01
      instances: kol-ci
      host: false
      notify_ci_dashboard: true
    secrets: inherit
